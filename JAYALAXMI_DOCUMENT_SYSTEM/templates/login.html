<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Jayalaxmi Silks</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head><body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
<form method="post" class="card p-4" style="width:360px;max-width:92vw">
  <div class="text-center mb-3"><div class="fw-bold" style="color:var(--navy);letter-spacing:.04em">JAYALAXMI SILKS</div>
    <div class="small" style="color:var(--gold);letter-spacing:.08em;text-transform:uppercase">Document System</div></div>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="alert alert-{{ cat }} py-2">{{ m }}</div>{% endfor %}{% endwith %}
  <label class="form-label">Password</label>
  <input class="form-control mb-3" type="password" name="password" autofocus required>
  <button class="btn btn-navy w-100">Sign in</button>
</form></body></html>
