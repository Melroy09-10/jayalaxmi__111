{% extends "base.html" %}{% block body %}
<div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
  <form method="get" class="d-flex gap-2"><input class="form-control" name="q" value="{{ q }}" placeholder="Search customers"><button class="btn btn-navy">Search</button></form>
</div>
<div class="card">{% if rows %}
<table class="t"><thead><tr><th>Name</th><th>Address</th><th>Mobile</th><th>Booking</th><th></th></tr></thead><tbody>
{% for c in rows %}<tr><td class="fw-medium">{{ c.name }}</td><td style="white-space:pre-line">{{ c.address }}</td><td>{{ c.mobile }}</td><td>{{ c.booking }}</td>
<td class="text-end text-nowrap">
<form method="post" action="{{ url_for('delete_customer', cid=c.id) }}" class="d-inline" onsubmit="return confirm('Delete this customer record?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}
</tbody></table>{% else %}<div class="p-4 text-secondary">No saved customers yet. They are added when you generate letters.</div>{% endif %}</div>

{% endblock %}
