<div class="letter from">
  <p class="lbl">To</p>
  <p class="in">{{ to_name }}</p>
  <p class="in">{{ to_address|lines }}</p>
  {% if to_mobile %}<p class="in">PH {{ to_mobile }}</p>{% endif %}
  <p class="book">BOOKING : {{ booking }}</p>
  <div class="fromblk">
    <p class="lbl in" style="margin-top:0">FROM</p>
    <p class="in">{{ company.from_line_1 }}</p>
    <p class="in">{{ company.from_line_2 }}</p>
    <p class="in">{{ company.from_line_3 }}</p>
    <p class="in">{{ company.from_line_4 }}</p>
  </div>
</div>
