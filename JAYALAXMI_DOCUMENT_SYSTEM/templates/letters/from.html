<div class="letter from" style="font-family: {{ fmt.fmt_font }}; font-size: {{ fmt.fmt_size_from }}pt;">
  <p class="lbl" style="font-weight:{{ fmt.fmt_weight_from }}">{{ fmt.fmt_from_to }}</p>
  <p class="in" style="font-weight:{{ fmt.fmt_weight_from }}">{{ to_name }}</p>
  <p class="in" style="font-weight:{{ fmt.fmt_weight_from }}">{{ to_address|addr }}</p>
  {% if to_mobile %}<p class="in" style="font-weight:{{ fmt.fmt_weight_from }}">{{ fmt.fmt_from_ph }} {{ to_mobile }}</p>{% endif %}
  <div class="fromblk" style="margin-top: {{ fmt.from_gap }}pt;">
    <p class="lbl" style="font-weight:{{ fmt.fmt_weight_from }};margin-top:0">{{ fmt.fmt_from_from }}</p>
    <p class="in" style="font-weight:{{ fmt.fmt_weight_from }}">{{ company.from_line_1 }}</p>
    <p class="in" style="font-weight:{{ fmt.fmt_weight_from }}">{{ company.from_line_2 }}</p>
    <p class="in" style="font-weight:{{ fmt.fmt_weight_from }}">{{ company.from_line_3 }}</p>
    <p class="in" style="font-weight:{{ fmt.fmt_weight_from }}">{{ company.from_line_4 }}</p>
  </div>
</div>
